<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>{{TITLE}}</title>
<!-- "Add to Home Screen" on iPad => opens with no browser bars at all -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{TITLE}}">
<meta name="theme-color" content="{{BG}}">
<link rel="manifest" href="/p/{{SLUG}}/manifest.webmanifest">
<link rel="apple-touch-icon" href="{{ICON}}">
<link rel="modulepreload" href="/vendor/pdfjs/pdf.min.mjs">
<style>
  :root { --bg: {{BG}}; --accent: #4f8cff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
  .slide { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .slide canvas { display: block; width: 100%; height: 100%; }
  .slide.anim { transition: transform var(--dur, 350ms) cubic-bezier(.2,.7,.2,1), opacity var(--dur, 350ms) ease; }
  #hotspots { position: absolute; left: 0; top: 0; z-index: 5; }
  .hs { position: absolute; border-radius: 6px; }
  .hs.flash { animation: flash .35s ease-out; }
  @keyframes flash { from { background: rgba(255,255,255,.35); } to { background: rgba(255,255,255,0); } }
  body.debug .hs { outline: 2px dashed rgba(79,140,255,.9); background: rgba(79,140,255,.15); }

  #indicator { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 6; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: rgba(0,0,0,.45); color: #fff; pointer-events: none;
    font-variant-numeric: tabular-nums; display: none; }

  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(8,10,14,.86); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); text-align: center; padding: 24px; }
  .overlay[hidden] { display: none; }
  #loader h1, #start h1 { font-size: clamp(22px, 3.2vw, 34px); font-weight: 650; margin: 0 0 18px; max-width: 900px; letter-spacing: -.01em; }
  .bar { width: min(420px, 80vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .muted { color: rgba(255,255,255,.62); font-size: 14px; margin-top: 12px; max-width: 520px; }
  .btn { appearance: none; border: 0; border-radius: 12px; padding: 14px 26px; font: inherit; font-weight: 600; font-size: 17px;
    background: var(--accent); color: #fff; cursor: pointer; }
  .btn.ghost { background: rgba(255,255,255,.12); }
  .btn + .btn { margin-left: 10px; }
  .error { color: #ff8a8a; }

  #menu { justify-content: flex-start; padding: max(20px, env(safe-area-inset-top)) 20px 20px; touch-action: pan-y; }
  #menu header { width: 100%; max-width: 1200px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  #menu header h2 { flex: 1; margin: 0; text-align: left; font-size: 18px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menu header .btn { padding: 10px 16px; font-size: 15px; margin: 0; }
  #grid { width: 100%; max-width: 1200px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; padding-bottom: 20px; align-content: start; }
  .thumb { appearance: none; border: 0; padding: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
  .thumb .img { width: 100%; aspect-ratio: var(--ar, 4/3); background: rgba(255,255,255,.08); border-radius: 8px; overflow: hidden;
    outline: 3px solid transparent; outline-offset: 2px; }
  .thumb.current .img { outline-color: var(--accent); }
  .thumb canvas { width: 100%; height: 100%; display: block; }
  .thumb span { display: block; margin-top: 6px; font-size: 13px; color: rgba(255,255,255,.7); }
  #menu .row { width: 100%; max-width: 1200px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px;
    font-size: 13px; color: rgba(255,255,255,.6); }
  #menu .row label { display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
  <div id="stage"><div id="hotspots"></div></div>
  <div id="indicator"></div>

  <div id="loader" class="overlay">
    <h1>{{TITLE}}</h1>
    <div class="bar"><i id="progress"></i></div>
    <div class="muted" id="loadmsg">Se încarcă prezentarea…</div>
  </div>

  <div id="start" class="overlay" hidden>
    <h1>{{TITLE}}</h1>
    <div><button class="btn" id="go">Pornește pe tot ecranul</button><button class="btn ghost" id="go-window">Fără full screen</button></div>
    <div class="muted" id="start-hint">Ține apăsat o secundă oriunde (sau atinge cu două degete) pentru meniu.</div>
  </div>

  <div id="menu" class="overlay" hidden>
    <header>
      <h2>{{TITLE}}</h2>
      <button class="btn ghost" id="m-fs">Full screen</button>
      <button class="btn" id="m-close">Înapoi la prezentare</button>
    </header>
    <div id="grid"></div>
    <div class="row">
      <span id="m-offline"></span>
      <label style="margin-left:auto"><input type="checkbox" id="m-debug"> Arată zonele interactive</label>
    </div>
  </div>

  <script type="module" src="/viewer.js"></script>
</body>
</html>
