<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Deck — Prezentări</title>
<link rel="icon" href="/icon.png">
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #14171f; --muted: #667085; --line: #e3e6eb;
    --accent: #2f6bff; --accent-ink: #fff; --danger: #d92d20; --ok: #12805c; --warn: #b54708;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #171b23; --ink: #e9ecf2; --muted: #98a1b2; --line: #272d38; --accent: #4f8cff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 18px 80px; }
  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  header.top h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -.01em; }
  header.top h1 small { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 6px; }
  button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 9px;
    padding: 8px 13px; font: inherit; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover, .btn:hover { border-color: var(--muted); }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .primary:hover { filter: brightness(1.08); border-color: var(--accent); }
  .danger { color: var(--danger); }
  input[type=text], input[type=password], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  #drop { display: block; border: 2px dashed var(--line); border-radius: 14px; background: var(--card); padding: 30px; text-align: center; color: var(--muted);
    transition: border-color .15s, background .15s; cursor: pointer; margin-bottom: 26px; }
  #drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
  #drop b { color: var(--ink); }
  #uploads:empty { display: none; }
  #uploads { margin: -14px 0 24px; display: grid; gap: 8px; }
  .up { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .up .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 7px; overflow: hidden; }
  .up .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .up.err { color: var(--danger); }

  .deck { display: grid; grid-template-columns: 180px 1fr; gap: 18px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .thumb { width: 180px; aspect-ratio: 1; border-radius: 10px; background: #12161e center/contain no-repeat; display: block; }
  .deck h2 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: center; }
  .deck h2 input { font-size: 17px; font-weight: 650; flex: 1; background: transparent; border-color: transparent; padding: 4px 6px; margin-left: -6px; }
  .deck h2 input:hover { border-color: var(--line); }
  .meta { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .meta .warn { color: var(--warn); }
  .url { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .url .base { color: var(--muted); font-size: 14px; }
  .url input { width: 220px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 18px; margin-top: 10px; font-size: 14px; }
  .settings label { display: flex; gap: 8px; align-items: center; }
  .settings input[type=color] { width: 36px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  #login { max-width: 360px; margin: 18vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px; }
  #login h1 { margin: 0 0 14px; font-size: 20px; }
  #login input { width: 100%; margin-bottom: 12px; }
  #login .err { color: var(--danger); font-size: 14px; min-height: 20px; }

  dialog { border: 0; border-radius: 16px; padding: 24px; background: var(--card); color: var(--ink); text-align: center; max-width: 92vw; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog img { width: 300px; max-width: 70vw; background: #fff; border-radius: 8px; padding: 8px; display: block; margin: 10px auto 14px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px;
    border-radius: 9px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .upform { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .upform label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); flex: 1; min-width: 200px; }
  h2.cat { font-size: 20px; margin: 26px 0 10px; }
  .lang { font-size: 12px; font-weight: 800; letter-spacing: .06em; background: var(--ink); color: var(--card); border-radius: 6px; padding: 3px 7px; }
  .refchip { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; }
  dialog.report { text-align: left; width: min(860px, 94vw); max-height: 88vh; overflow: auto; padding: 22px; }
  .rhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .rhead h2 { margin: 2px 0; font-size: 22px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 6px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--muted); font-size: 13px; }
  .tile b { display: block; font-size: 24px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tile.err b { color: var(--danger); } .tile.warnt b { color: var(--warn); } .tile.ok b { color: var(--ok); }
  .verdict { font-weight: 600; }
  dialog.report h3 { margin: 20px 0 8px; font-size: 16px; }
  .okline { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); border-radius: 8px; padding: 9px 12px; font-weight: 600; }
  .issue { border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 9px; margin-bottom: 8px; }
  .issue.error { border-left-color: var(--danger); } .issue.warning { border-left-color: var(--warn); }
  .issue summary { cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 10px 12px; list-style: none; }
  .issue .sev { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .issue.error .sev { color: var(--danger); } .issue.warning .sev { color: var(--warn); }
  .issue .it { flex: 1; font-weight: 600; } .issue .n { color: var(--muted); font-weight: 700; }
  .issue .advice { margin: 0 12px 8px; color: var(--muted); font-size: 14px; }
  .issue ul { list-style: none; margin: 0; padding: 0 12px 10px; display: grid; gap: 3px; font-size: 14px; max-height: 300px; overflow: auto; }
  .issue li { display: flex; gap: 10px; } .pg { font-weight: 700; min-width: 44px; }
  .rfoot { margin-top: 14px; text-align: right; }
  @media (max-width: 640px) { .deck { grid-template-columns: 1fr; } .thumb { width: 100%; max-width: 240px; } }
</style>
</head>
<body>
  <div id="login" hidden>
    <h1>PDF Deck</h1>
    <form id="login-form">
      <input type="password" id="pw" placeholder="Parola de administrare" autocomplete="current-password" autofocus>
      <div class="err" id="login-err"></div>
      <button class="primary" style="width:100%;justify-content:center">Intră</button>
    </form>
  </div>

  <div class="wrap" id="app" hidden>
    <header class="top">
      <h1>Prezentări <small id="count"></small></h1>
      <button id="logout" hidden>Ieșire</button>
    </header>

    <div class="upform">
      <label>Catalog <input type="text" id="up-catalog" list="up-catalogs" placeholder="de ex. Zeigebuch"></label>
      <label>Limba <select id="up-lang"><option value="">Detectează din numele fișierului</option><option>DE</option><option>FR</option><option>IT</option><option>EN</option><option>RO</option><option value="XX">Altă limbă</option></select></label>
      <datalist id="up-catalogs"></datalist>
    </div>
    <label id="drop">
      <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
      <b>Trage aici PDF-ul exportat din InDesign</b> sau atinge pentru a alege fișierul.<br>
      <span style="font-size:13px">Export din InDesign: <i>File → Export → Adobe PDF (Interactive)</i>. Fiecare PDF primește propria adresă.</span>
    </label>
    <div id="uploads"></div>
    <div id="list"></div>
  </div>

  <dialog id="qr">
    <div id="qr-title" style="font-weight:650"></div>
    <img id="qr-img" alt="Cod QR">
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px">Scanează cu camera iPad-ului pentru a deschide prezentarea.</div>
    <form method="dialog"><button>Închide</button></form>
  </dialog>
  <dialog id="report" class="report"><div id="report-body"></div><div class="rfoot"><button id="report-close" type="button">Închide</button></div></dialog>
  <div class="toast" id="toast"></div>

  <script type="module" src="/admin.js"></script>
</body>
</html>
